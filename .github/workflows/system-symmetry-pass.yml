name: Shadcn Redux migration
on:
  push:
    branches: [main]
jobs:
  migrate:
    if: github.event.head_commit.message == 'Run shadcn Redux migration v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: |
          python3 scripts/shadcn-redux-migration.py
          python3 scripts/shadcn-redux-repair.py
      - name: Install and validate
        run: |
          npm install
          if grep -R "@mui" src; then exit 1; fi
          npm run build
          node --check server/index.mjs
      - name: Commit migration
        run: |
          rm -f scripts/shadcn-redux-migration.py scripts/shadcn-redux-repair.py
          git config user.name "Uddalak"
          git config user.email "84083101+Imdavid21@users.noreply.github.com"
          git add -A
          git commit -m "Migrate Supergram to shadcn and Redux"
          git push
