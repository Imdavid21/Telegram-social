name: Responsive product and marketing pass
on:
  push:
    branches: [main]
jobs:
  redesign:
    if: github.event.head_commit.message == 'Run responsive marketing pass'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply responsive redesign
        run: python3 scripts/responsive-marketing-pass.py
      - name: Validate
        run: |
          npm install
          if grep -R "@mui" src; then exit 1; fi
          npm run build
          node --check server/index.mjs
      - name: Commit
        run: |
          rm -f scripts/responsive-marketing-pass.py
          git config user.name "Uddalak"
          git config user.email "84083101+Imdavid21@users.noreply.github.com"
          git add -A
          git commit -m "Redesign every surface for responsive product marketing"
          git push
