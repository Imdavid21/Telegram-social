name: Backend v3 validation
on:
  push:
    branches: [supergram-backend-final-v3]
permissions:
  contents: write
jobs:
  validate:
    if: github.event.head_commit.message == 'Commit backend v3 validated UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply search and trust UI patch
        run: python3 scripts/apply-backend-search-ui.py
      - name: Validate exact product tree
        run: |
          npm install --no-audit --no-fund
          node --check server/index.mjs
          node --check api/proxy.mjs
          npm run build
      - name: Commit only validated UI files
        run: |
          git config user.name "Uddalak"
          git config user.email "84083101+Imdavid21@users.noreply.github.com"
          git add src/ProductApp.tsx src/components/FeedCard.tsx
          git commit -m "Apply validated Telegram search UI"
          git push
