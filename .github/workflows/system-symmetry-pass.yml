name: Master social UX implementation
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'Run master social UX implementation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply redesign
        run: python3 scripts/master-social-redesign.py
      - name: Validate
        run: |
          npm install
          npm run build
          node --check server/index.mjs
      - name: Commit
        run: |
          rm -f scripts/master-social-redesign.py
          git config user.name "Uddalak"
          git config user.email "84083101+Imdavid21@users.noreply.github.com"
          git add -A
          git commit -m "Implement media-first Telegram social architecture"
          git push
