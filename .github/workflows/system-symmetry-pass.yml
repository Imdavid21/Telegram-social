name: Contextual summary repair
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'Run contextual summary repair'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/contextual-summary-pass.py
      - name: Validate
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          rm -f scripts/contextual-summary-pass.py
          git config user.name "Uddalak"
          git config user.email "84083101+Imdavid21@users.noreply.github.com"
          git add -A
          git commit -m "Build context-aware local news summaries"
          git push
