name: Backend v3 validation
on:
  push:
    branches: [supergram-backend-final-v3]
jobs:
  validate:
    if: github.event.head_commit.message == 'Run backend v3 validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply search and trust UI patch
        run: python3 scripts/apply-backend-search-ui.py
      - name: Validate exact product tree
        run: |
          npm install --no-audit --no-fund
          node --check server/index.mjs
          node --check api/proxy.mjs
          npm run build
      - name: Export patched UI files
        uses: actions/upload-artifact@v4
        with:
          name: backend-v3-patched-ui
          path: |
            src/ProductApp.tsx
            src/components/FeedCard.tsx
          if-no-files-found: error
