name: MUI v9 codemod

on:
  push:
    branches: [mui-crm-rebuild]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mui-crm-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx --yes @mui/codemod@latest v9.0.0/system-props src
      - run: npx --yes @mui/codemod@latest deprecations/dialog-props src
      - run: npx --yes @mui/codemod@latest deprecations/drawer-props src
      - run: npm install --package-lock-only
      - name: Commit migration output
        run: |
          if git diff --quiet; then
            echo "No codemod changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package-lock.json
          git commit -m "Apply Material UI v9 codemods [skip codemod]"
          git push origin HEAD:mui-crm-rebuild
