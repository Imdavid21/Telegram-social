name: Apply news summary hotfix
on:
  push:
    paths:
      - '.github/workflows/news-summary-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix summary eligibility and immediate local rendering
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/FeedCard.tsx')
          s = p.read_text()
          old = """  const minimumBriefLength = item.sourceType === 'person' || channel.type === 'person' ? 48 : 80\n  const isNewsBrief = !media && ageHours <= 168 && text.trim().length >= minimumBriefLength\n"""
          new = """  const privateConversation = item.sourceType === 'person' || channel.type === 'person'\n  const minimumBriefLength = privateConversation ? 24 : 56\n  const meaningfulWords = cleanText(text).split(/\\s+/).filter(Boolean).length\n  const isNewsBrief = ageHours <= 168 && text.trim().length >= minimumBriefLength && meaningfulWords >= (privateConversation ? 5 : 8)\n"""
          if old not in s:
              raise SystemExit('summary eligibility block not found')
          s = s.replace(old, new, 1)
          old2 = """    const controller = new AbortController()\n    setBrief(localBrief(text))\n    setBriefState('loading')\n    void summarizeMessage(text, {\n"""
          new2 = """    const controller = new AbortController()\n    const immediate = localBrief(text)\n    setBrief(immediate)\n    setBriefState('local')\n    void summarizeMessage(text, {\n"""
          if old2 not in s:
              raise SystemExit('summary loading block not found')
          s = s.replace(old2, new2, 1)
          old3 = """  const briefLabel = briefState === 'ai' ? 'AI brief' : briefState === 'loading' ? 'Summarizing' : 'Local brief'\n"""
          new3 = """  const briefLabel = briefState === 'ai' ? 'AI brief' : 'Smart brief'\n"""
          if old3 not in s:
              raise SystemExit('summary label block not found')
          p.write_text(s.replace(old3, new3, 1))
      - name: Commit fix
        run: |
          git config user.name "Supergram UX Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/FeedCard.tsx
          git commit -m "Fix local news summaries across feed posts"
          git push