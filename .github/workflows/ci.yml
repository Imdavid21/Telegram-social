name: Clean backend validation
on:
  push:
    branches: [supergram-backend-clean-validate]
jobs:
  build:
    if: github.event.head_commit.message == 'Run clean backend validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: if grep -R "@mui" src; then exit 1; fi
      - run: node --check server/index.mjs
      - run: node --check api/proxy.mjs
      - run: npm run build
