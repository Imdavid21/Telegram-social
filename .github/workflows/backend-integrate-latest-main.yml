name: Backend finish integration

on:
  push:
    branches: [supergram-backend-integrated]

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run backend finish integration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patch
        run: python3 scripts/backend-integrate-latest-main.py
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          node --check server/index.mjs
          node --check api/proxy.mjs
          npm run build
      - name: Commit integrated result
        run: |
          rm scripts/backend-integrate-latest-main.py
          rm .github/workflows/backend-integrate-latest-main.yml
          git config user.name "Uddalak"
          git config user.email "84083101+Imdavid21@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Telegram search with latest account context"
          git push
