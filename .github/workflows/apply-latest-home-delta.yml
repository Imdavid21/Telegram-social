name: Apply latest Home delta

on:
  push:
    branches: [supergram-backend-integrated]

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run latest Home delta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Home delta
        run: python3 scripts/apply-latest-home-delta.py
      - name: Validate integrated product
        run: |
          npm install --no-audit --no-fund
          node --check server/index.mjs
          node --check api/proxy.mjs
          npm run build
      - name: Commit final integrated product
        run: |
          rm scripts/apply-latest-home-delta.py
          rm .github/workflows/apply-latest-home-delta.yml
          git config user.name "Uddalak"
          git config user.email "84083101+Imdavid21@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile Telegram backend finish with Home redesign"
          git push
