name: Account context pass
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'Run account profile and context pass'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/account-context-pass.py
      - name: Validate
        run: |
          npm install
          npm run build
          node --check server/index.mjs
      - name: Commit
        run: |
          rm scripts/account-context-pass.py
          rm .github/workflows/account-context-pass.yml
          git config user.name "Uddalak"
          git config user.email "84083101+Imdavid21@users.noreply.github.com"
          git add -A
          git commit -m "Pull Telegram profile and use sent messages as context only"
          git push
