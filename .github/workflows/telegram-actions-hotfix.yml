name: Apply Telegram interaction hotfix
on:
  push:
    paths:
      - '.github/workflows/telegram-actions-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch interactions
        run: python .github/scripts/patch_telegram_actions.py
      - name: Validate and commit
        run: |
          npm install --ignore-scripts
          node --check server/index.mjs
          npm run build
          git config user.name "Supergram UX Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/index.mjs src/lib/api.ts src/components/FeedCard.tsx src/app-system.css
          git commit -m "Implement Telegram-native post actions"
          git push
