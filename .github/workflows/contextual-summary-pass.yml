  if (value.length <= limit) return value
  const clipped = value.slice(0, limit + 1)
  const cut = clipped.lastIndexOf(' ')
  return `${(cut > limit * 0.65 ? clipped.slice(0, cut) : clipped.slice(0, limit)).trim()}…`
